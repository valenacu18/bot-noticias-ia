name: Noticias diarias de IA

on:
  # Ejecución manual desde la pestaña Actions
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Antigüedad máxima de las noticias en horas (para pruebas usa 72)"
        required: false
        default: "30"

  # Ejecución diaria: 12:00 UTC = 09:00 AM en Argentina (UTC-3, sin horario de verano)
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

concurrency:
  group: noticias-ia
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Ejecutar el bot de noticias
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '30' }}
        run: python bot.py
