name: Bot de Noticias IA Automatico

on:
  schedule:
    - cron: '0 12 * * *' # Se ejecuta automáticamente todos los días a las 9:00 AM de Argentina
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install feedparser requests

      - name: Ejecutar bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py
